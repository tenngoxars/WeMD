[package]
name = "wemd-desktop"
version = "1.6.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 测试构建专用，正式包不启用
automation = []

# 体积优先：安装包大小是原型的验收项之一
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
