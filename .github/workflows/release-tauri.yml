name: desktop-release-tauri

# 桌面端 v2（Tauri）发版。v1.x 仍由 release.yml（Electron）发布，两条流水线按 tag 主版本号分流。
# 打 tag：先建草稿 Release 写入官网 changelog，三平台构建并上传，全部成功后才公开；tag 含「-」时为 pre-release。
# 非 tag 触发（手动 workflow_dispatch）：只构建并上传工作流产物，不签名、不发布。
on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      - name: Fetch changelog for release notes
        run: |
          curl -fsSL https://raw.githubusercontent.com/tenngoxars/WeMD-homepage/main/vp-docs/about/changelog.md -o /tmp/wemd-changelog.md

      - name: Extract release notes
        run: |
          python3 - "${{ github.ref_name }}" /tmp/wemd-changelog.md /tmp/wemd-release-notes.md <<'PY'
          import re, sys
          tag, src, dst = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(src, encoding="utf-8").read()
          # 匹配 "## vX.Y.Z ..." 整行标题，避免前缀误匹配（如 v2.0.0 不会命中 v2.0.0-beta.1）
          m = re.search(rf"^## {re.escape(tag)}(?: |$)[^\n]*\n", text, re.M)
          if not m:
              sys.exit(f"changelog 中未找到 {tag} 条目，请先在官网仓库更新 changelog 再重跑")
          start = m.end()
          nxt = re.search(r"^## v\d", text[start:], re.M)
          end = start + nxt.start() if nxt else len(text)
          open(dst, "w", encoding="utf-8").write(text[start:end].strip() + "\n")
          PY

      # 重跑时同 tag 可能已有草稿：复用并更新；已公开的不覆盖
      - name: Create or update draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv")
          if [[ $(grep -c . <<<"$existing") -gt 1 ]]; then
            echo "::error::tag $TAG 对应多个 Release，请在 GitHub 上手动删除多余的再重跑"
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease="$prerelease" --verify-tag \
              --title "WeMD $TAG" --notes-file /tmp/wemd-release-notes.md
            id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          else
            read -r id draft <<<"$existing"
            if [[ "$draft" != "true" ]]; then
              echo "::error::$TAG 的 Release 已公开，不能覆盖。如需重发请换新 tag"
              exit 1
            fi
            jq -n --rawfile body /tmp/wemd-release-notes.md --arg name "WeMD $TAG" --argjson pre "$prerelease" \
              '{name: $name, body: $body, prerelease: $pre}' \
              | gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" --input - > /dev/null
          fi
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release-notes
    # 非 tag 触发时 release-notes 被跳过，构建照常进行
    if: ${{ !cancelled() && needs.release-notes.result != 'failure' }}
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 以 deb 为主（系统 WebKitGTK），AppImage 为实验性
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup PNPM
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发版：签名更新包，安装包与 .sig 上传到草稿 Release；latest.json 由 updater-json 统一生成，避免并发读改写丢平台
      - name: Build and upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          releaseId: ${{ needs.release-notes.outputs.release-id }}
          uploadUpdaterJson: false

      # 验证：只构建，不签名、不发布
      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --filter @wemd/desktop tauri build --bundles ${{ matrix.bundles }}

      - name: Upload workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: wemd-tauri-${{ runner.os }}
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  updater-json:
    needs: [release-notes, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.release-notes.outputs.release-id }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"
          gh api "$api/$RELEASE_ID" > /tmp/release.json
          assets=$(jq -c '[.assets[] | {id, name}]' /tmp/release.json)
          # 按后缀找唯一资产，0 个或多个都失败
          pick() {
            local matched
            matched=$(jq -c --arg suffix "$1" '[.[] | select(.name | endswith($suffix))]' <<<"$assets")
            if [[ $(jq length <<<"$matched") -ne 1 ]]; then
              echo "::error::后缀 $1 的资产应恰好 1 个，实际：$(jq -r 'map(.name) | join(", ")' <<<"$matched")" >&2
              exit 1
            fi
            jq -c '.[0]' <<<"$matched"
          }
          platforms='{}'
          for entry in "darwin-aarch64 .app.tar.gz" "windows-x86_64 -setup.exe" "linux-x86_64 .AppImage"; do
            read -r platform suffix <<<"$entry"
            asset=$(pick "$suffix")
            sig=$(pick "$suffix.sig")
            name=$(jq -r .name <<<"$asset")
            # 草稿资产只能经 API 下载；草稿的 browser_download_url 是 untagged 地址，公开后失效，所以按 tag 拼正式地址
            signature=$(gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$(jq -r .id <<<"$sig")")
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(jq -rn --arg n "$name" '$n | @uri')"
            platforms=$(jq -c --arg p "$platform" --arg s "$signature" --arg u "$url" '.[$p] = {signature: $s, url: $u}' <<<"$platforms")
          done
          jq -n --arg version "${TAG#v}" --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" --slurpfile release /tmp/release.json \
            '{version: $version, notes: ($release[0].body // ""), pub_date: $pub_date, platforms: $platforms}' > latest.json
          # --clobber 覆盖重跑时留下的旧 latest.json；gh release upload 支持草稿 Release
          gh release upload "$TAG" latest.json --clobber -R "$GITHUB_REPOSITORY"

  publish:
    needs: [release-notes, build, updater-json]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY" --draft=false
