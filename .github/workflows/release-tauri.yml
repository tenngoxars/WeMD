name: desktop-release-tauri

# 桌面端 v2（Tauri）发版。v1.x 仍由 release.yml（Electron）发布，两条流水线按 tag 主版本号分流。
# 打 tag：先建草稿 Release 写入官网 changelog，三平台构建并上传，全部成功后才公开；tag 含「-」时为 pre-release。
# 非 tag 触发（手动或推送迁移分支）：只构建并上传工作流产物，不签名、不发布。
on:
  push:
    tags:
      - "v2.*"
    # ponytail: 合并到 main 前验证用，合并时删除这一项，之后改用 workflow_dispatch
    branches:
      - "feat/tauri-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      - name: Fetch changelog for release notes
        run: |
          curl -fsSL https://raw.githubusercontent.com/tenngoxars/WeMD-homepage/main/vp-docs/about/changelog.md -o /tmp/wemd-changelog.md

      - name: Extract release notes
        run: |
          python3 - "${{ github.ref_name }}" /tmp/wemd-changelog.md /tmp/wemd-release-notes.md <<'PY'
          import re, sys
          tag, src, dst = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(src, encoding="utf-8").read()
          # 匹配 "## vX.Y.Z ..." 整行标题，避免前缀误匹配（如 v2.0.0 不会命中 v2.0.0-beta.1）
          m = re.search(rf"^## {re.escape(tag)}(?: |$)[^\n]*\n", text, re.M)
          if not m:
              sys.exit(f"changelog 中未找到 {tag} 条目，请先在官网仓库更新 changelog 再重跑")
          start = m.end()
          nxt = re.search(r"^## v\d", text[start:], re.M)
          end = start + nxt.start() if nxt else len(text)
          open(dst, "w", encoding="utf-8").write(text[start:end].strip() + "\n")
          PY

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft $prerelease --verify-tag \
            --title "WeMD $TAG" --notes-file /tmp/wemd-release-notes.md
          echo "release-id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q ".[] | select(.tag_name == \"$TAG\") | .id")" >> "$GITHUB_OUTPUT"

  build:
    needs: release-notes
    # 非 tag 触发时 release-notes 被跳过，构建照常进行
    if: ${{ !cancelled() && needs.release-notes.result != 'failure' }}
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 以 deb 为主（系统 WebKitGTK），AppImage 为实验性
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup PNPM
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发版：签名更新包并生成 latest.json，上传到草稿 Release
      - name: Build and upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          releaseId: ${{ needs.release-notes.outputs.release-id }}
          uploadUpdaterJson: true

      # 验证：只构建，不签名、不发布
      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --filter @wemd/desktop tauri build --bundles ${{ matrix.bundles }}

      - name: Upload workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: wemd-tauri-${{ runner.os }}
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: [release-notes, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY" --draft=false
