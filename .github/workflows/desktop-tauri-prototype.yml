name: desktop-tauri-prototype

# Tauri 原型三平台构建：推送原型分支或手动触发，产物不发布，验证完删除
# （workflow_dispatch 要求文件已在默认分支，原型阶段靠分支推送触发）
on:
  push:
    branches:
      - "feat/tauri-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis
    env:
      # 原型只构建 Tauri，跳过 Electron 二进制下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup PNPM
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @wemd/desktop tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: wemd-tauri-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
