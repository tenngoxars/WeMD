name: tauri-linux-image

# 仅在 Linux 构建镜像定义变动或手动触发时构建并推送到 GHCR，平时不执行
on:
  push:
    branches:
      - main
    paths:
      - ".github/docker/tauri-linux.Dockerfile"
      - ".github/workflows/tauri-linux-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/tenngoxars/wemd-tauri-linux

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          file: .github/docker/tauri-linux.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:ubuntu-22.04
          cache-from: type=gha
          cache-to: type=gha,mode=max
