name: ci

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# PR 连续推送只保留最新一次；main 每次运行独占一个分组，保证每个提交都完整跑过
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # 测试与 lint+构建互不依赖，拆成两台机器并行
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: test
            run: pnpm test
          - task: lint-build
            run: pnpm --filter @wemd/web lint && pnpm --filter @wemd/web build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task }}
        run: ${{ matrix.run }}
