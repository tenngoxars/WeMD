name: desktop-release

# 桌面端 v1.x（Electron）发版；v2 起由 release-tauri.yml（Tauri）发布
on:
  push:
    tags:
      - "v1.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先建草稿 Release 并写入简介，等三个平台都传完再公开。
  # 之前由 macOS 任务写简介，它最后跑完，Release 会先以空简介公开一到几分钟。
  release-notes:
    runs-on: ubuntu-latest
    steps:
      # 非 tag 触发时整段跳过，构建任务照常跑，只上传工作流产物
      - name: Fetch changelog for release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          curl -fsSL https://raw.githubusercontent.com/tenngoxars/WeMD-homepage/main/vp-docs/about/changelog.md -o /tmp/wemd-changelog.md

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - "${{ github.ref_name }}" /tmp/wemd-changelog.md /tmp/wemd-release-notes.md <<'PY'
          import re, sys
          tag, src, dst = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(src, encoding="utf-8").read()
          # 匹配 "## vX.Y.Z ..." 整行标题，避免前缀误匹配（如 v1.4.3 不会命中 v1.4.30）
          m = re.search(rf"^## {re.escape(tag)}(?: |$)[^\n]*\n", text, re.M)
          if not m:
              sys.exit(f"changelog 中未找到 {tag} 条目，请先在官网仓库更新 changelog 再重跑")
          start = m.end()
          nxt = re.search(r"^## v\d", text[start:], re.M)
          end = start + nxt.start() if nxt else len(text)
          open(dst, "w", encoding="utf-8").write(text[start:end].strip() + "\n")
          PY

      - name: Create draft release with notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: WeMD ${{ github.ref_name }}
          # Release 简介与官网更新日志保持同步，由 changelog 提取生成
          body_path: /tmp/wemd-release-notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-macos:
    needs: [release-notes]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # tag 构建读不到 main 上的 macOS 依赖缓存，每次未命中还要额外上传，所以不开缓存；
      # pnpm 用 Node 自带的 corepack 启用，版本取自 package.json 的 packageManager
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup PNPM
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @wemd/web run build

      - name: Sync disk before build
        run: sync

      - name: Build Electron (macOS)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd apps/electron && pnpm run build:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wemd-macos
          path: apps/electron/release/WeMD-*-arm64-mac.zip

      # tag 构建时把安装包传到 release-notes 建好的草稿 Release；手动触发只留工作流产物
      - name: Upload asset to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/electron/release/WeMD-*-arm64-mac.zip

  build-windows:
    needs: [release-notes]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 同 macOS：不开依赖缓存；pnpm/action-setup 在 Windows 上自举要 20～60 秒，改用 corepack
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup PNPM
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @wemd/web run build

      - name: Build Electron (Windows)
        run: cd apps/electron && pnpm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wemd-windows
          path: apps/electron/release/*.exe

      - name: Upload asset to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/electron/release/*.exe

  build-linux:
    needs: [release-notes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @wemd/web run build

      - name: Build Electron (Linux)
        run: cd apps/electron && pnpm run build:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wemd-linux
          path: apps/electron/release/*.AppImage

      - name: Upload asset to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/electron/release/*.AppImage

  # 三个平台都传完才公开，读者不会看到缺安装包或空简介的 Release
  publish:
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY" --draft=false
